[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rogii"
version = "1.0.0"
description = "Lean, inference-safe runtime for ROGII wellbore experiments"
requires-python = ">=3.10"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.0",
  "scikit-learn>=1.4",
  "threadpoolctl>=3.0",
]

[project.optional-dependencies]
dev = ["build>=1.2", "pytest>=8.0"]
sequence = [
  "scipy>=1.12",
  "torch==2.12.1",
]

[project.scripts]
rogii = "rogii.cli:main"

[tool.setuptools.packages.find]
where = ["src"]
